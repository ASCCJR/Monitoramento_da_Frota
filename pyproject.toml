[project]
name = "monitoramento-da-frota"
version = "0.1.0"
description = "Exemplo local de priorização de avisos de risco em uma frota"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
]

[dependency-groups]
dev = ["pytest==9.0.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
