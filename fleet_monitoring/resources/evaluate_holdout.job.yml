resources:
  jobs:
    evaluate_holdout:
      name: "[${bundle.target}] Monitoramento da frota — avaliação de junho"
      description: >-
        Registra a liberação e avalia junho uma única vez com modelo, versão,
        features e política imutáveis do freeze informado.
      max_concurrent_runs: 1
      performance_target: STANDARD
      queue:
        enabled: true
      parameters:
        - name: freeze_id
          default: ""
        - name: release_holdout
          default: "false"
      tasks:
        - task_key: evaluate_holdout
          timeout_seconds: 3600
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/03_evaluate_holdout.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}
              experiment_path: /Users/${workspace.current_user.userName}/monitoramento_da_frota_${bundle.target}_ml
              project_files_path: ${workspace.file_path}
              job_run_id: "{{job.run_id}}"
              task_run_id: "{{task.run_id}}"
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==3.1.0
              - scikit-learn==1.5.2
              - lightgbm==4.6.0
              - pandas==2.1.4
              - numpy==1.26.4
              - pyyaml==6.0.2
