resources:
  jobs:
    score_batch:
      name: "[${bundle.target}] Monitoramento da frota — scoring em lote"
      description: >-
        Executa scoring target-free por intervalo usando versão e política
        imutáveis. O recurso não possui agenda enquanto timezone e cadência
        operacional não forem confirmados.
      max_concurrent_runs: 1
      performance_target: STANDARD
      queue:
        enabled: true
      parameters:
        - name: freeze_id
          default: ""
        - name: score_start
          default: "2025-06-01 00:00:00"
        - name: score_end
          default: "2025-07-01 00:00:00"
      tasks:
        - task_key: score_batch
          timeout_seconds: 3600
          environment_key: ml_env
          notebook_task:
            notebook_path: ../notebooks/04_score_batch.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              gold_schema: ${var.gold_schema}
              ml_schema: ${var.ml_schema}
              experiment_path: /Users/${workspace.current_user.userName}/monitoramento_da_frota_${bundle.target}_ml
              project_files_path: ${workspace.file_path}
              job_run_id: "{{job.run_id}}"
              task_run_id: "{{task.run_id}}"
      environments:
        - environment_key: ml_env
          spec:
            environment_version: "4"
            dependencies:
              - mlflow==3.1.0
              - scikit-learn==1.5.2
              - lightgbm==4.6.0
              - pandas==2.1.4
              - numpy==1.26.4
              - pyyaml==6.0.2
