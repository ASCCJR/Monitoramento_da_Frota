  - name: history_1h_is_complete
    family: completeness
    data_type: boolean
    definition: Entire one-hour Tag history is observable before cutoff.
    source: int_scoring_grade and global unavailability
    event_time: prediction_timestamp
    availability_rule: Uses only source coverage known at cutoff.
    window: '[t-1h,t)'
    null_rule: never null
