version: 1.0.0
frozen_at: '2026-08-24'
entity: equipment
entity_key: tag
timestamp_key: prediction_timestamp
row_key: scoring_row_id
target: y_episode
feature_count: 46
source_timezone: UNCONFIRMED
availability_is_proxy: true
prohibited_inputs:
  - tag
  - equipamento_id
  - operador_anonimo
  - matricula_operador_hash
  - alarme
  - alarme_id
  - duracao_ciclo_min
  - classe_operacional
  - y_episode
  - next_episode_id
  - next_episode_start
features:
  - name: cutoff_hour
    family: calendar
    data_type: int
    definition: Hour 0-23 derived from prediction_timestamp.
    source: prediction_timestamp
    event_time: prediction_timestamp
    availability_rule: Deterministic at cutoff.
    window: cutoff
    null_rule: never null
    model_use: primary
  - name: day_of_week_iso
    family: calendar
    data_type: int
    definition: ISO weekday 1 Monday through 7 Sunday.
    source: prediction_timestamp
    event_time: prediction_timestamp
    availability_rule: Deterministic at cutoff.
    window: cutoff
    null_rule: never null
    model_use: primary
  - name: day_of_month
    family: calendar
    data_type: int
    definition: Calendar day 1-31 at cutoff.
    source: prediction_timestamp
    event_time: prediction_timestamp
    availability_rule: Deterministic at cutoff.
    window: cutoff
    null_rule: never null
    model_use: primary
  - name: is_night_window_proxy
    family: calendar
    data_type: tinyint
    definition: One from 18:00 through 05:59; analytical proxy, not official shift.
    source: prediction_timestamp
    event_time: prediction_timestamp
    availability_rule: Deterministic at cutoff.
    window: cutoff
    null_rule: never null
    model_use: primary
  - name: is_truck
    family: equipment
    data_type: tinyint
    definition: One when tipo_equipamento equals Caminhao.
    source: int_equipamentos.tipo_equipamento
    event_time: static attribute
    availability_rule: Reconciled one-to-one by Tag in source period.
    window: static
    null_rule: never null
    model_use: primary
