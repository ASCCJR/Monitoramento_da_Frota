    model_use: primary
  - name: hours_since_last_episode_start
    family: episode_history
    data_type: double
    definition: Hours since the latest observed primary episode start before cutoff.
    source: int_dontgo_episodios
    event_time: episode_start_proxy
    availability_rule: latest observed start strictly before cutoff.
    window: source start through t open
    null_rule: null when no prior observed episode; use has_prior_episode
    model_use: primary
  - name: has_prior_episode
    family: episode_history
    data_type: tinyint
    definition: One when at least one observed primary episode exists before cutoff.
    source: int_dontgo_episodios
    event_time: episode_start_proxy
    availability_rule: only starts strictly before cutoff.
    window: source start through t open
    null_rule: never null
    model_use: primary
  - name: episode_history_exposure_days
    family: episode_history
    data_type: double
    definition: Days between first observable Tag history and cutoff.
    source: int_scoring_grade
    event_time: prediction_timestamp and tag_first_event_time
    availability_rule: both timestamps are available at cutoff in retrospective study.
    window: source start through t
    null_rule: never null
    model_use: primary
