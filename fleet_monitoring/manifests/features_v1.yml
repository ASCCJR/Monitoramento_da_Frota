  - name: critical_rate_4h
    family: rate
    data_type: double
    definition: critical_events_4h divided by events_4h.
    source: derived feature
    event_time: inherited from numerator and denominator
    availability_rule: inherited from four-hour aggregates.
    window: '[t-4h,t)'
    null_rule: null when events_4h is zero
    model_use: primary
  - name: critical_rate_24h
    family: rate
