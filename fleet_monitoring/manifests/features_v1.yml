    window: '[t-24h,t)'
    null_rule: null when 24-hour rate is zero
    model_use: primary
  - name: prior_episode_count
    family: episode_history
    data_type: bigint
    definition: Observed primary episode starts strictly before cutoff since source start.
    source: int_dontgo_episodios
    event_time: episode_start_proxy
    availability_rule: only observed starts with episode_start_proxy before cutoff.
    window: source start through t open
    null_rule: zero when none observed
    model_use: primary
  - name: episodes_7d
